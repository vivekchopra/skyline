name: Skyline

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history needed so the base ref is available for diffing
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Needed only if the PR touches TypeScript files; skyline uses the
      # real TypeScript compiler API to parse .ts/.tsx (see README).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install skyline
        run: pip install .

      - name: Generate structural diff report
        run: |
          skyline diff \
            --repo . \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.sha }}" \
            --out skyline_report.html \
            --comment skyline_comment.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: skyline-report
          path: skyline_report.html

      # Opt in to failing the check on a new policy violation with
      # --fail-on-violation. Left off until a repo has a policy.
      # CRAP is never a merge gate.

      - name: Post sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- skyline-report -->';
            const body = fs.readFileSync('skyline_comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
